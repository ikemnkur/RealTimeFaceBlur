<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Blur — Webcam</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 1.5rem 1rem 3rem; gap: 1rem; }

        /* Canvas container */
        .canvas-wrap {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 0 1px var(--border), 0 20px 60px rgba(0,0,0,0.6);
            max-width: 100%;
        }
        video  { display: none; }
        canvas { display: block; max-width: 100%; max-height: 480px; width: auto; height: auto; background: #000; }

        /* Controls row */
        .ctrl-row { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }

        /* Settings panel */
        .settings {
            width: 100%;
            max-width: 520px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }
        .settings-title { font-family: var(--display); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
        .setting-row { display: flex; align-items: center; gap: 0.75rem; }
        .setting-row label { font-size: 0.75rem; color: var(--muted); min-width: 160px; }
        .setting-row input[type="range"] { flex: 1; accent-color: var(--accent); }
        .setting-row select { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 0.3rem 0.5rem; font-size: 0.78rem; font-family: var(--mono); }
        .setting-val { font-size: 0.72rem; color: var(--accent); min-width: 55px; text-align: right; }
    </style>
    <script src="js/guard.js"></script>
</head>
<body>
    <nav>
        <a href="/" class="logo">◈ Face Blur</a>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/webcam" class="active">Webcam</a></li>
            <li><a href="/video">Video</a></li>
            <!-- <li><a href="/video-pro" class="nav-pro">Pro ✦</a></li>
            <li><a href="/video-advanced" class="nav-adv">Advanced ✦</a></li> -->
            <li><a href="/tutorial">Tutorial</a></li>
            <li><a href="/support">Support</a></li>
            <li><a href="/login" class="nav-cta">Sign In</a></li>
        </ul>
    </nav>

    <div class="main">
        <div id="status">Loading AI model…</div>

        <div class="ctrl-row">
            <button id="startBtn" class="btn-primary">▶ Start Webcam</button>
            <button id="stopWebcamBtn" disabled>⏹ Stop Webcam</button>
            <button id="recordBtn" class="btn-green" disabled>⏺ Start Recording</button>
            <button id="stopBtn" class="btn-danger" disabled>↓ Stop & Download</button>
        </div>

        <div class="canvas-wrap">
            <video id="inputVideo" muted playsinline></video>
            <canvas id="outputCanvas"></canvas>
        </div>

        <div class="settings">
            <div class="settings-title">Settings</div>

            <div class="setting-row">
                <label>Output Resolution</label>
                <select id="resolutionSelect">
                    <option value="1">Original (100%)</option>
                    <option value="0.75">High (75%)</option>
                    <option value="0.5" selected>Medium (50%)</option>
                    <option value="0.25">Low (25%)</option>
                </select>
            </div>

            <div class="setting-row">
                <label>Blur Radius</label>
                <input type="range" id="blurRadius" min="20" max="100" value="40" step="5">
                <span class="setting-val" id="blurValue">40px</span>
            </div>

            <div class="setting-row">
                <label>Detection Update Rate</label>
                <input type="range" id="detectionRate" min="50" max="1000" value="200" step="50">
                <span class="setting-val" id="rateValue">200ms</span>
            </div>

            <div class="setting-row">
                <label>Detection Sensitivity</label>
                <input type="range" id="sensitivity" min="0.5" max="0.95" value="0.75" step="0.05">
                <span class="setting-val" id="sensitivityValue">0.75</span>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Face Blur App · <a href="/support">Support</a>
    </footer>

    <script>
        const video = document.getElementById('inputVideo');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const stopWebcamBtn = document.getElementById('stopWebcamBtn');
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const blurRadiusInput = document.getElementById('blurRadius');
        const blurValue = document.getElementById('blurValue');
        const resolutionSelect = document.getElementById('resolutionSelect');
        const detectionRateInput = document.getElementById('detectionRate');
        const rateValue = document.getElementById('rateValue');
        const sensitivityInput = document.getElementById('sensitivity');
        const sensitivityValue = document.getElementById('sensitivityValue');

        let model, mediaRecorder, recordedChunks = [];
        let isProcessing = false;
        let blurRadius = 40;
        let resolutionScale = 0.5;
        let detectionInterval = 200;
        let sensitivity = 0.75;
        let lastDetectionTime = 0;
        let cachedPredictions = [];
        let webcamStream = null;

        blurRadiusInput.addEventListener('input', (e) => {
            blurRadius = parseInt(e.target.value);
            blurValue.textContent = blurRadius + 'px';
        });

        resolutionSelect.addEventListener('change', (e) => {
            resolutionScale = parseFloat(e.target.value);
            if (video.videoWidth && video.videoHeight) {
                canvas.width = video.videoWidth * resolutionScale;
                canvas.height = video.videoHeight * resolutionScale;
            }
        });

        detectionRateInput.addEventListener('input', (e) => {
            detectionInterval = parseInt(e.target.value);
            rateValue.textContent = detectionInterval + 'ms';
        });

        sensitivityInput.addEventListener('input', (e) => {
            sensitivity = parseFloat(e.target.value);
            sensitivityValue.textContent = sensitivity;
        });

        async function loadModel() {
            model = await blazeface.load();
            status.innerText = "✅ Ready! Click 'Start Webcam' to begin.";
        }

        async function processFrame() {
            if (!isProcessing) return;
            const currentTime = Date.now();
            if (currentTime - lastDetectionTime >= detectionInterval) {
                try {
                    const predictions = await model.estimateFaces(video, false);
                    cachedPredictions = predictions.filter(face => {
                        return face.probability ? face.probability[0] >= sensitivity : true;
                    });
                    lastDetectionTime = currentTime;
                } catch (err) { console.error('Detection error:', err); }
            }
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            cachedPredictions.forEach(face => {
                const start = face.topLeft;
                const end = face.bottomRight;
                const width = end[0] - start[0];
                const height = end[1] - start[1];
                const scaleX = canvas.width / video.videoWidth;
                const scaleY = canvas.height / video.videoHeight;
                const centerX = (start[0] + width / 2) * scaleX;
                const centerY = (start[1] + height / 2) * scaleY;
                const radius = Math.max(width * scaleX, height * scaleY) / 2;
                ctx.save();
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.clip();
                ctx.filter = `blur(${blurRadius}px)`;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                ctx.restore();
            });
            requestAnimationFrame(processFrame);
        }

        function startApp() {
            canvas.width = video.videoWidth * resolutionScale;
            canvas.height = video.videoHeight * resolutionScale;
            isProcessing = true;
            lastDetectionTime = 0;
            cachedPredictions = [];
            processFrame();
            recordBtn.disabled = false;
            stopWebcamBtn.disabled = false;
            startBtn.disabled = true;
            status.innerText = "🎥 Webcam Active — Recording Available";
        }

        startBtn.onclick = async () => {
            try {
                webcamStream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = webcamStream;
                video.onloadedmetadata = () => { video.play(); startApp(); };
            } catch (err) {
                status.innerText = "❌ Error: Could not access webcam";
                console.error(err);
            }
        };

        stopWebcamBtn.onclick = () => {
            if (webcamStream) {
                webcamStream.getTracks().forEach(t => t.stop());
                video.srcObject = null;
                isProcessing = false;
                startBtn.disabled = false;
                stopWebcamBtn.disabled = true;
                recordBtn.disabled = true;
                status.innerText = "⏹️ Webcam Stopped";
            }
        };

        recordBtn.onclick = () => {
            recordedChunks = [];
            const stream = canvas.captureStream(30);
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'webcam_blurred_' + Date.now() + '.webm';
                a.click();
                status.innerText = "💾 Recording Saved!";
            };
            mediaRecorder.start();
            recordBtn.disabled = true;
            stopBtn.disabled = false;
            status.innerText = "🔴 Recording… (Max 120s)";
            setTimeout(() => { if (mediaRecorder.state === "recording") stopBtn.click(); }, 120000);
        };

        stopBtn.onclick = () => {
            mediaRecorder.stop();
            recordBtn.disabled = false;
            stopBtn.disabled = true;
            status.innerText = "🎥 Webcam Active — Recording Available";
        };

        loadModel();
    </script>
</body>
</html>
