<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Face Blur — Video</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#7c6cfc">
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap');

        :root {
            --bg: #0d0d12;
            --surface: #14141c;
            --surface2: #1c1c28;
            --border: rgba(255, 255, 255, 0.07);
            --accent: #7c6cfc;
            --accent2: #c084fc;
            --green: #22d3a0;
            --red: #f87171;
            --text: #e2e8f0;
            --muted: #64748b;
            --mono: 'DM Mono', monospace;
            --display: 'Syne', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--mono);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── NAV ── */
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.9rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--display);
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            text-decoration: none;
            color: var(--muted);
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            transition: color 0.2s;
        }

        nav a:hover,
        nav a.active {
            color: var(--text);
        }

        /* ── MAIN ── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem 3rem;
            gap: 1.2rem;
        }

        /* Desktop: side-by-side layout */
        .content-wrapper {
            display: flex;
            flex-direction: row;
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
            align-items: flex-start;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            flex: 0 0 320px;
            /* min-width: 280px; */
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .page-title {
            font-family: var(--display);
            font-size: clamp(1.6rem, 5vw, 2.5rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            text-align: center;
        }

        .page-title span {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ── STATUS PILL ── */
        #status {
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            padding: 0.4rem 1rem;
            border-radius: 999px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--muted);
            transition: all 0.3s;
        }

        #status.ready {
            border-color: var(--green);
            color: var(--green);
        }

        #status.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        #status.recording {
            border-color: var(--red);
            color: var(--red);
        }

        /* ── UPLOAD ── */
        .upload-area {
            width: 100%;
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s;
            background: var(--surface);
        }

        .upload-area:hover,
        .upload-area.dragging {
            border-color: var(--accent);
            background: rgba(124, 108, 252, 0.06);
        }

        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
        }

        .upload-area h3 {
            font-family: var(--display);
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .upload-area p {
            font-size: 0.75rem;
            color: var(--muted);
        }

        /* ── CANVAS WRAPPER ── */
        .canvas-wrap {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 0 1px var(--border), 0 20px 60px rgba(0, 0, 0, 0.6);
            max-width: 100%;
            max-height: 512px;
        }

        video {
            display: none;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 512px;
            width: auto;
            height: auto;
            background: #000;
        }

        /* ── VIDEO CONTROLS ── */
        .video-controls {
            display: none;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1rem;
        }

        .video-controls.active {
            display: flex;
        }

        .playback-row {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            justify-content: center;
        }

        .time-display {
            font-size: 0.72rem;
            color: var(--muted);
            letter-spacing: 0.06em;
            min-width: 110px;
            text-align: center;
        }

        /* ── RECORD BUTTONS ── */
        .rec-row {
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ── SETTINGS ── */
        .settings {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .settings-title {
            font-family: var(--display);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .setting-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .setting-row label {
            font-size: 0.75rem;
            color: var(--muted);
            min-width: 130px;
        }

        .setting-row input[type="range"] {
            flex: 1;
            accent-color: var(--accent);
        }

        .setting-row select {
            flex: 1;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 0.3rem 0.5rem;
            font-size: 0.78rem;
            font-family: var(--mono);
        }

        .setting-val {
            font-size: 0.72rem;
            color: var(--accent);
            min-width: 55px;
            text-align: right;
        }

        /* ── MEMORY METER ── */
        .mem-bar-wrap {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .mem-bar-wrap label {
            font-size: 0.75rem;
            color: var(--muted);
            min-width: 130px;
        }

        .mem-bar-bg {
            flex: 1;
            height: 6px;
            background: var(--surface2);
            border-radius: 99px;
            overflow: hidden;
        }

        .mem-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--green), var(--accent));
            border-radius: 99px;
            transition: width 1s;
            width: 0%;
        }

        .mem-label {
            font-size: 0.72rem;
            color: var(--muted);
            min-width: 55px;
            text-align: right;
        }

        /* ── BUTTONS ── */
        button {
            font-family: var(--mono);
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            padding: 0.55rem 1.2rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            background: var(--surface2);
            color: var(--text);
            transition: all 0.2s;
        }

        button:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        button.btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        button.btn-primary:hover:not(:disabled) {
            background: var(--accent2);
            border-color: var(--accent2);
            color: #fff;
        }

        button.btn-danger {
            border-color: var(--red);
            color: var(--red);
        }

        button.btn-danger:hover:not(:disabled) {
            background: rgba(248, 113, 113, 0.1);
        }

        button.btn-green {
            border-color: var(--green);
            color: var(--green);
        }

        button.btn-green:hover:not(:disabled) {
            background: rgba(34, 211, 160, 0.1);
        }

        button.btn-active {
            background: rgba(124, 108, 252, 0.15);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* canvas crosshair in click-blur mode */
        .canvas-wrap.click-blur-mode canvas {
            cursor: crosshair;
        }

        /* ── COUNTDOWN OVERLAY ── */
        .countdown-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            background: rgba(0, 0, 0, 0.45);
            transition: opacity 0.25s;
            z-index: 10;
        }
        .countdown-overlay.visible { opacity: 1; }
        .countdown-number {
            font-family: var(--display);
            font-size: clamp(5rem, 20vw, 9rem);
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 60px rgba(124, 108, 252, 0.9), 0 0 20px rgba(124, 108, 252, 0.6);
            animation: cd-pop 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes cd-pop {
            0%   { transform: scale(1.6); opacity: 0; }
            30%  { opacity: 1; }
            100% { transform: scale(1);   opacity: 1; }
        }

        /* ── UPLOAD MODAL ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            width: min(480px, calc(100vw - 2rem));
            position: relative;
            box-shadow: 0 32px 80px rgba(0,0,0,0.8);
        }
        .modal-close {
            position: absolute;
            top: 0.9rem;
            right: 0.9rem;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1.1rem;
            line-height: 1;
            padding: 0.25rem 0.4rem;
            cursor: pointer;
            border-radius: 6px;
        }
        .modal-close:hover { color: var(--text); background: var(--surface2); }

        /* seekbar */
        input[type=range].seek-bar {
            width: 100%;
            accent-color: var(--accent);
        }

        footer {
            text-align: center;
            padding: 1.2rem;
            font-size: 0.72rem;
            color: var(--muted);
            border-top: 1px solid var(--border);
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        @media (max-width: 480px) {
            nav ul {
                gap: 0.9rem;
            }

            nav a {
                font-size: 0.7rem;
            }
        }

        /* Mobile: stack layout with side-by-side controls */
        @media (max-width: 768px) {
            .content-wrapper {
                flex-direction: column;
            }

            .left-panel {
                order: 2;
                flex: 1 1 auto;
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
            }

            .left-panel .upload-area {
                /* flex: 1 1 45%; */
                min-width: 200px;
            }

            .left-panel .settings {
                flex: 1 1 45%;
                min-width: 200px;
            }

            .right-panel {
                order: 1;
                width: 100%;
            }

            .canvas-wrap {
                max-height: none;
            }

            canvas {
                max-height: 60vh;
            }
        }

        @media (max-width: 480px) {
            .left-panel {
                flex-direction: column;
            }

            .left-panel .upload-area,
            .left-panel .settings {
                flex: 1 1 100%;
                min-width: auto;
            }
        }

        /* ── PREVIEW PiP ── */
        .preview-pip {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 28%;
            min-width: 72px;
            max-width: 176px;
            border-radius: 8px;
            overflow: hidden;
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.75);
            display: none;
            background: #000;
            z-index: 5;
        }
        .preview-pip.visible { display: block; }
        #previewCanvas {
            display: block;
            width: 100%;
            height: auto;
            max-height: none;
            background: #000;
        }
        .preview-pip-label {
            position: absolute;
            top: 5px;
            left: 6px;
            font-size: 0.58rem;
            font-family: var(--mono);
            color: rgba(255, 255, 255, 0.85);
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 6px;
            border-radius: 3px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            pointer-events: none;
        }
    </style>
    <script src="js/guard.js"></script>
</head>

<body>
    <script>FaceBlurAuth.requirePlan('advanced');</script>

{% set activePage = "video" %}
    {% include "_partials/nav.html" %}

    <div class="main">
        <!-- <h1 class="page-title">Video <span>Face Blur</span></h1> -->

        <div id="status" class="ready">✓ Ready — upload a video</div>

    <!-- Upload modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-box">
            <button class="modal-close" id="modalCloseBtn" aria-label="Close">✕</button>
            <div class="upload-area" id="uploadArea" onclick="document.getElementById('uploadVideo').click()">
                <div class="upload-icon">📁</div>
                <h3>Click or drop a video here</h3>
                <p>MP4 · WebM · MOV · AVI</p>
                <input type="file" id="uploadVideo" accept="video/*" style="display:none">
            </div>
        </div>
    </div>

    <div class="content-wrapper">
            <!-- Left Panel: Upload & Settings -->
            <div class="left-panel">


                <!-- Settings -->
                <div class="settings">
                    <div class="settings-title">Settings</div>

                    <div class="setting-row">
                        <button id="openUploadBtn" class="btn-primary" style="flex:1">📂 Open Video…</button>
                    </div>

                    <div class="setting-row">
                        <label>Output Resolution</label>
                        <select id="resolutionSelect">
                            <option value="1">Original (100%)</option>
                            <option value="0.75">High (75%)</option>
                            <option value="0.5" selected>Medium (50%)</option>
                            <option value="0.25">Low (25%)</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Mask Type</label>
                        <select id="maskTypeSelect">
                            <option value="blur" selected>Pixelated</option>
                            <option value="smooth">Smooth Blur</option>
                            <option value="black">Black Ellipse</option>
                            <option value="image">Custom Image</option>
                        </select>
                    </div>

                    <div class="setting-row" id="maskImageRow" style="display:none">
                        <label>Mask Image</label>
                        <button id="uploadMaskBtn" style="flex:1">📷 Upload…</button>
                        <input type="file" id="uploadMaskInput" accept="image/*" style="display:none">
                        <img id="maskPreview" style="display:none;width:36px;height:36px;border-radius:5px;border:1px solid var(--border);object-fit:cover;flex-shrink:0">
                    </div>

                    <div class="setting-row">
                        <label>Click Blur</label>
                        <button id="clickBlurBtn" style="flex:1">✦ Off</button>
                    </div>

                    <div class="setting-row">
                        <label>CB Size</label>
                        <input type="range" id="cbSize" min="10" max="120" value="40" step="5">
                        <span class="setting-val" id="cbSizeValue">40px</span>
                    </div>

                    <div class="setting-row">
                        <label>CB Fade Time</label>
                        <input type="range" id="cbFade" min="0.1" max="3" value="0.4" step="0.1">
                        <span class="setting-val" id="cbFadeValue">0.4s</span>
                    </div>

                    <div class="setting-row">
                        <label>CB Opacity</label>
                        <input type="range" id="cbAlpha" min="0.1" max="1" value="1" step="0.05">
                        <span class="setting-val" id="cbAlphaValue">1.00</span>
                    </div>

                    <div class="setting-row">
                        <label>CB Offset X</label>
                        <input type="range" id="cbOffsetX" min="-80" max="80" value="0" step="1">
                        <span class="setting-val" id="cbOffsetXValue">0px</span>
                    </div>

                    <div class="setting-row">
                        <label>CB Offset Y</label>
                        <input type="range" id="cbOffsetY" min="-80" max="80" value="-32" step="1">
                        <span class="setting-val" id="cbOffsetYValue">-32px</span>
                    </div>

                    <div class="setting-row">
                        <label>Preview Advance</label>
                        <input type="range" id="previewAdvanceIn" min="0.5" max="2" value="1" step="0.1">
                        <span class="setting-val" id="previewAdvanceVal">1.0s</span>
                    </div>

                </div>
            </div>

            <!-- Right Panel: Canvas & Controls -->
            <div class="right-panel">
                <!-- Canvas -->
                <div class="canvas-wrap" id="canvasWrap">
                    <video id="inputVideo" muted playsinline></video>
                    <video id="previewVideo" muted playsinline></video>
                    <canvas id="outputCanvas"></canvas>
                    <div id="countdownOverlay" class="countdown-overlay"></div>
                    <div class="preview-pip" id="previewPip">
                        <canvas id="previewCanvas"></canvas>
                        <span class="preview-pip-label" id="previewPipLabel">⚡ +1.0s preview</span>
                    </div>
                </div>

                <!-- Playback controls -->
                <div>
                    <div class="video-controls" id="videoControls">
                        <div class="playback-row">
                            <button id="playPauseBtn">▶ Play</button>
                            <button id="restartBtn">↺ Restart</button>
                            <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
                        </div>
                        <input type="range" id="seekBar" class="seek-bar" min="0" max="100" value="0" step="0.1">
                        <div class="rec-row">
                            <button id="processBtn" class="btn-primary" disabled>⏺ Process & Export</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    {% include "_partials/footer.html" %}

    <script>
        // ─────────────────────────────────────────────
        //  DOM refs
        // ─────────────────────────────────────────────
        const video = document.getElementById('inputVideo');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: false });
        const statusEl = document.getElementById('status');
        const uploadArea = document.getElementById('uploadArea');
        const uploadVideo = document.getElementById('uploadVideo');
        const videoControls = document.getElementById('videoControls');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const seekBar = document.getElementById('seekBar');
        const timeDisplay = document.getElementById('timeDisplay');
        const processBtn = document.getElementById('processBtn');
        const resSel = document.getElementById('resolutionSelect');
        const maskTypeSelect = document.getElementById('maskTypeSelect');
        const clickBlurBtn = document.getElementById('clickBlurBtn');
        const canvasWrap = document.getElementById('canvasWrap');
        const cbSizeIn     = document.getElementById('cbSize');
        const cbSizeVal    = document.getElementById('cbSizeValue');
        const cbFadeIn     = document.getElementById('cbFade');
        const cbFadeVal    = document.getElementById('cbFadeValue');
        const cbAlphaIn    = document.getElementById('cbAlpha');
        const cbAlphaVal   = document.getElementById('cbAlphaValue');
        const cbOffsetXIn  = document.getElementById('cbOffsetX');
        const cbOffsetXVal = document.getElementById('cbOffsetXValue');
        const cbOffsetYIn  = document.getElementById('cbOffsetY');
        const cbOffsetYVal = document.getElementById('cbOffsetYValue');
        const uploadModal   = document.getElementById('uploadModal');
        const openUploadBtn = document.getElementById('openUploadBtn');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const previewPip    = document.getElementById('previewPip');
        const previewCanvas = document.getElementById('previewCanvas');
        const previewCtx    = previewCanvas.getContext('2d');
        const previewVideo  = document.getElementById('previewVideo');
        const previewPipLabel     = document.getElementById('previewPipLabel');
        const previewAdvanceIn    = document.getElementById('previewAdvanceIn');
        const previewAdvanceValEl = document.getElementById('previewAdvanceVal');
        const maskImageRow    = document.getElementById('maskImageRow');
        const uploadMaskBtn   = document.getElementById('uploadMaskBtn');
        const uploadMaskInput = document.getElementById('uploadMaskInput');
        const maskPreview     = document.getElementById('maskPreview');

        // ── Modal open / close ──
        function openModal()  { uploadModal.classList.add('open'); }
        function closeModal() { uploadModal.classList.remove('open'); }
        openUploadBtn.addEventListener('click', openModal);
        modalCloseBtn.addEventListener('click', closeModal);
        uploadModal.addEventListener('click', e => { if (e.target === uploadModal) closeModal(); });

        // ─────────────────────────────────────────────
        //  State
        // ─────────────────────────────────────────────
        let mediaRecorder = null;
        let recordedChunks = [];
        let rafId = null;
        let isRunning = false;
        let previewAdvance = 1.0; // seconds the PiP leads main playback
        let lastPreviewSyncMs = 0;

        // ─────────────────────────────────────────────
        //  User settings (live)
        // ─────────────────────────────────────────────
        let resScale = 0.5;
        let maskType = 'blur';    // 'blur' | 'smooth' | 'black' | 'image'
        let customMaskImage = null;

        // Mouse / touch click-blur state
        let mouseBlurEnabled    = true;
        let mouseBlurPos        = null;  // { x, y } in canvas pixels, or null
        let mouseBlurHeld       = false;
        let mouseBlurReleasedAt = 0;     // performance.now() timestamp of last release
        let cbSize      = 40;   // click-blur radius
        let cbFadeTime  = 0.4;  // seconds to fade out on release
        let cbAlpha     = 1.0;  // max opacity
        let cbOffsetX   = 0;    // horizontal offset in canvas px
        let cbOffsetY   = -32;  // vertical offset in canvas px


        // ─────────────────────────────────────────────
        //  Settings listeners
        // ─────────────────────────────────────────────
        resSel.addEventListener('change', e => {
            resScale = +e.target.value;
            if (video.videoWidth) resizeCanvas();
        });

        maskTypeSelect.addEventListener('change', e => {
            maskType = e.target.value;
            maskImageRow.style.display = maskType === 'image' ? 'flex' : 'none';
        });

        uploadMaskBtn.addEventListener('click', () => uploadMaskInput.click());
        uploadMaskInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file || !file.type.startsWith('image/')) return;
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                if (customMaskImage?._objURL) URL.revokeObjectURL(customMaskImage._objURL);
                img._objURL = url;
                customMaskImage = img;
                maskPreview.src = url;
                maskPreview.style.display = 'block';
                uploadMaskBtn.textContent = '✓ ' + file.name.slice(0, 18);
            };
            img.src = url;
        });

        clickBlurBtn.addEventListener('click', () => {
            mouseBlurEnabled = !mouseBlurEnabled;
            clickBlurBtn.classList.toggle('btn-active', mouseBlurEnabled);
            clickBlurBtn.textContent = mouseBlurEnabled ? '✦ On' : '✦ Off';
            canvasWrap.classList.toggle('click-blur-mode', mouseBlurEnabled);
            if (!mouseBlurEnabled) {
                mouseBlurPos = null;
                mouseBlurHeld = false;
                // Let the normal video-driven loop decide whether to keep going.
                // If video is paused/ended, stop now; if playing, leave it.
                if (!isRunning || video.paused || video.ended) {
                    isRunning = false;
                    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
                }
            } else {
                // Start the loop if it isn't already running (e.g. video is paused).
                if (!isRunning) {
                    isRunning = true;
                    rafId = requestAnimationFrame(renderFrame);
                }
            }
            syncPreviewPip();
        });

        cbSizeIn.addEventListener('input', e => {
            cbSize = +e.target.value;
            cbSizeVal.textContent = cbSize + 'px';
        });
        cbFadeIn.addEventListener('input', e => {
            cbFadeTime = +e.target.value;
            cbFadeVal.textContent = cbFadeTime.toFixed(1) + 's';
        });
        cbAlphaIn.addEventListener('input', e => {
            cbAlpha = +e.target.value;
            cbAlphaVal.textContent = cbAlpha.toFixed(2);
        });
        cbOffsetXIn.addEventListener('input', e => {
            cbOffsetX = +e.target.value;
            cbOffsetXVal.textContent = cbOffsetX + 'px';
        });
        cbOffsetYIn.addEventListener('input', e => {
            cbOffsetY = +e.target.value;
            cbOffsetYVal.textContent = cbOffsetY + 'px';
        });

        previewAdvanceIn.addEventListener('input', e => {
            previewAdvance = +e.target.value;
            previewAdvanceValEl.textContent = previewAdvance.toFixed(1) + 's';
            previewPipLabel.textContent = `⚡ +${previewAdvance.toFixed(1)}s preview`;
            lastPreviewSyncMs = 0; // force immediate resync on next frame
        });

        // ── Preview PiP sync ──
        function syncPreviewPip() {
            const show = mouseBlurEnabled && video.readyState >= 2;
            previewPip.classList.toggle('visible', show);
            if (show) {
                const target = Math.min(video.currentTime + previewAdvance, video.duration || 0);
                if (video.paused) {
                    previewVideo.pause();
                    previewVideo.currentTime = target;
                } else if (previewVideo.paused) {
                    previewVideo.currentTime = target;
                    previewVideo.play().catch(() => {});
                }
            } else {
                previewVideo.pause();
            }
        }

        // ─────────────────────────────────────────────
        //  Click-blur canvas events
        //  Maps pointer/touch coords into canvas pixel space,
        //  accounting for CSS scaling of the canvas element.
        // ─────────────────────────────────────────────
        function canvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const src = e.touches ? e.touches[0] : e;
            return {
                x: (src.clientX - rect.left) * scaleX,
                y: (src.clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('mousedown', e => {
            if (!mouseBlurEnabled) return;
            mouseBlurHeld = true;
            mouseBlurPos = canvasCoords(e);
        });
        canvas.addEventListener('mousemove', e => {
            if (!mouseBlurEnabled || !mouseBlurHeld) return;
            mouseBlurPos = canvasCoords(e);
        });
        canvas.addEventListener('mouseup', () => {
            if (!mouseBlurEnabled || !mouseBlurHeld) return;
            mouseBlurHeld = false;
            mouseBlurReleasedAt = performance.now();
        });
        canvas.addEventListener('mouseleave', () => {
            if (!mouseBlurEnabled || !mouseBlurHeld) return;
            mouseBlurHeld = false;
            mouseBlurReleasedAt = performance.now();
        });
        canvas.addEventListener('touchstart', e => {
            if (!mouseBlurEnabled) return;
            e.preventDefault();
            mouseBlurHeld = true;
            mouseBlurPos = canvasCoords(e);
        }, { passive: false });
        canvas.addEventListener('touchmove', e => {
            if (!mouseBlurEnabled || !mouseBlurHeld) return;
            e.preventDefault();
            mouseBlurPos = canvasCoords(e);
        }, { passive: false });
        canvas.addEventListener('touchend', () => {
            if (!mouseBlurEnabled || !mouseBlurHeld) return;
            mouseBlurHeld = false;
            mouseBlurReleasedAt = performance.now();
        });

        function resizeCanvas() {
            canvas.width = Math.round(video.videoWidth * resScale);
            canvas.height = Math.round(video.videoHeight * resScale);

        }

        // ─────────────────────────────────────────────
        //  Drag & drop
        // ─────────────────────────────────────────────
        uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragging'); });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragging'));
        uploadArea.addEventListener('drop', e => {
            e.preventDefault();
            uploadArea.classList.remove('dragging');
            const f = e.dataTransfer.files[0];
            if (f?.type.startsWith('video/')) { closeModal(); handleVideoUpload(f); }
        });
        uploadVideo.onchange = e => { if (e.target.files[0]) { closeModal(); handleVideoUpload(e.target.files[0]); } };

        // ─────────────────────────────────────────────
        //  Time display
        // ─────────────────────────────────────────────
        function fmt(s) {
            return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
        }
        video.addEventListener('timeupdate', () => {
            if (video.duration) {
                timeDisplay.textContent = `${fmt(video.currentTime)} / ${fmt(video.duration)}`;
                seekBar.value = (video.currentTime / video.duration) * 100;
            }
        });

        // ─────────────────────────────────────────────
        //  Playback controls
        // ─────────────────────────────────────────────
        playPauseBtn.addEventListener('click', () => {
            if (video.paused) { video.play(); startLoop(); }
            else { video.pause(); stopLoop(); }
            playPauseBtn.textContent = video.paused ? '▶ Play' : '⏸ Pause';
        });

        restartBtn.addEventListener('click', () => {
            video.currentTime = 0;
            video.play();
            playPauseBtn.textContent = '⏸ Pause';
            startLoop();
        });

        let isSeeking = false;
        seekBar.addEventListener('mousedown', () => { isSeeking = true; video.pause(); });
        seekBar.addEventListener('touchstart', () => { isSeeking = true; video.pause(); }, { passive: true });
        seekBar.addEventListener('input', e => {
            video.currentTime = (e.target.value / 100) * video.duration;
        });
        seekBar.addEventListener('mouseup', () => { isSeeking = false; video.play(); startLoop(); });
        seekBar.addEventListener('touchend', () => { isSeeking = false; video.play(); startLoop(); });

        video.addEventListener('ended', () => {
            stopLoop();
            playPauseBtn.textContent = '▶ Play';
        });

        video.addEventListener('play',  syncPreviewPip);
        video.addEventListener('pause', syncPreviewPip);
        video.addEventListener('seeked', () => {
            if (previewPip.classList.contains('visible')) {
                const target = Math.min(video.currentTime + previewAdvance, video.duration || 0);
                previewVideo.currentTime = target;
                lastPreviewSyncMs = performance.now(); // reset drift timer
            }
        });

        // ─────────────────────────────────────────────
        //  Render loop — draws every rAF tick.
        // ─────────────────────────────────────────────
        function renderFrame(now) {
            if (!isRunning) return;
            rafId = requestAnimationFrame(renderFrame);

            const videoReady = video.readyState >= 2;

            // Draw current video frame on every tick so stale click-blur patches don't accumulate
            if (videoReady && canvas.width > 0) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            }

            // Draw preview PiP (1 s ahead)
            if (previewPip.classList.contains('visible') && previewVideo.readyState >= 2 && previewCanvas.width > 0) {
                previewCtx.drawImage(previewVideo, 0, 0, previewCanvas.width, previewCanvas.height);
                // Drift correction: re-sync if offset drifts > 200 ms
                if (now - lastPreviewSyncMs > 500) {
                    lastPreviewSyncMs = now;
                    const target = video.currentTime + previewAdvance;
                    if (target < video.duration && Math.abs(previewVideo.currentTime - target) > 0.2) {
                        previewVideo.currentTime = target;
                    }
                }
            }

            // Apply manual click-blur (runs even when video is paused)
            applyMouseBlur(now);
        }

        // ─────────────────────────────────────────────
        //  Manual click-blur — drawn at the pointer position
        //  while held, then fades out over cbFadeTime.
        // ─────────────────────────────────────────────
        function applyMouseBlur(now) {
            if (!mouseBlurEnabled || !mouseBlurPos) return;

            let alpha = cbAlpha;
            if (!mouseBlurHeld) {
                const elapsed = now - mouseBlurReleasedAt;
                alpha = cbAlpha * (1.0 - elapsed / (cbFadeTime * 1000));
                if (alpha <= 0) { mouseBlurPos = null; return; } // fully faded — reset
            }

            const r = cbSize;
            if (r <= 0) return;
            const centerX = mouseBlurPos.x + cbOffsetX;
            const centerY = mouseBlurPos.y + cbOffsetY;

            ctx.save();
            ctx.globalAlpha = alpha;

            if (maskType === 'black') {
                const grad = ctx.createRadialGradient(
                    centerX, centerY, r * 0.55,
                    centerX, centerY, r
                );
                grad.addColorStop(0, 'rgba(0,0,0,1)');
                grad.addColorStop(0.6, 'rgba(0,0,0,0.95)');
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.beginPath();
                ctx.ellipse(centerX, centerY, r, r, 0, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
            } else if (maskType === 'smooth') {
                // Smooth blur — two passes for strong edge suppression
                const x = Math.max(0, centerX - r);
                const y = Math.max(0, centerY - r);
                const w = Math.min(r * 2, canvas.width - x);
                const h = Math.min(r * 2, canvas.height - y);
                if (w > 0 && h > 0) {
                    const blurPx = Math.max(10, Math.round(r / 2));
                    const W = Math.round(w), H = Math.round(h);
                    const tmp1 = document.createElement('canvas');
                    tmp1.width = W; tmp1.height = H;
                    const tctx1 = tmp1.getContext('2d');
                    tctx1.filter = `blur(${blurPx}px)`;
                    tctx1.drawImage(canvas, x, y, w, h, 0, 0, W, H);
                    const tmp2 = document.createElement('canvas');
                    tmp2.width = W; tmp2.height = H;
                    const tctx2 = tmp2.getContext('2d');
                    tctx2.filter = `blur(${blurPx}px)`;
                    tctx2.drawImage(tmp1, 0, 0);
                    ctx.beginPath();
                    ctx.ellipse(centerX, centerY, r, r, 0, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.drawImage(tmp2, 0, 0, W, H, x, y, w, h);
                }
            } else if (maskType === 'image' && customMaskImage) {
                ctx.beginPath();
                ctx.ellipse(centerX, centerY, r, r, 0, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(customMaskImage, centerX - r, centerY - r, r * 2, r * 2);
            } else {
                const x = Math.max(0, centerX - r);
                const y = Math.max(0, centerY - r);
                const w = Math.min(r * 2, canvas.width - x);
                const h = Math.min(r * 2, canvas.height - y);
                if (w > 0 && h > 0) {
                    const pixelSize = Math.max(4, Math.round(r / 6));
                    const tempCanvas = document.createElement('canvas');
                    const tempCtx = tempCanvas.getContext('2d');
                    const smallW = Math.ceil(w / pixelSize);
                    const smallH = Math.ceil(h / pixelSize);
                    tempCanvas.width = smallW;
                    tempCanvas.height = smallH;
                    tempCtx.drawImage(canvas, x, y, w, h, 0, 0, smallW, smallH);
                    ctx.beginPath();
                    ctx.ellipse(centerX, centerY, r, r, 0, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(tempCanvas, 0, 0, smallW, smallH, x, y, w, h);
                }
            }
            ctx.restore();
        }

        // ─────────────────────────────────────────────
        //  Loop helpers
        // ─────────────────────────────────────────────
        function startLoop() {
            if (isRunning) return;
            isRunning = true;
            rafId = requestAnimationFrame(renderFrame);
            setStatus('active', '▶ Processing video…');
        }

        function stopLoop() {
            // If click-blur is active keep the rAF loop alive so mouse-blur
            // rendering continues to work even when the video is paused/ended.
            if (mouseBlurEnabled) return;
            isRunning = false;
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        }

        // ─────────────────────────────────────────────
        //  Video load
        // ─────────────────────────────────────────────
        function handleVideoUpload(file) {
            stopLoop();
            if (video.src) URL.revokeObjectURL(video.src);

            const url = URL.createObjectURL(file);
            video.src = url;
            previewVideo.src = url; // same URL — both elements buffer independently
            video.muted = false;

            video.onloadedmetadata = () => {
                resizeCanvas();
                previewCanvas.width  = Math.round(video.videoWidth  * 0.5);
                previewCanvas.height = Math.round(video.videoHeight * 0.5);
                videoControls.classList.add('active');
                processBtn.disabled = false;
                video.play();
                playPauseBtn.textContent = '⏸ Pause';
                startLoop();
                syncPreviewPip();
            };
        }





        // ─────────────────────────────────────────────
        //  Status helper
        // ─────────────────────────────────────────────
        function setStatus(cls, msg) {
            statusEl.className = '';
            if (cls) statusEl.classList.add(cls);
            statusEl.textContent = msg;
        }

        // ─────────────────────────────────────────────
        //  Process & Export
        //  Restarts video from beginning, starts recording,
        //  and auto-downloads when the video ends.
        // ─────────────────────────────────────────────
        // ─────────────────────────────────────────────
        //  Starts the actual recording after countdown.
        // ─────────────────────────────────────────────
        function beginRecording() {
            video.currentTime = 0;
            video.play();
            playPauseBtn.textContent = '⏸ Pause';
            startLoop();

            const stream = canvas.captureStream(30);
            const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
                ? 'video/webm;codecs=vp9'
                : 'video/webm';

            mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 2_000_000 });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const a = Object.assign(document.createElement('a'), {
                    href: URL.createObjectURL(blob),
                    download: 'face_blur_' + Date.now() + '.webm'
                });
                a.click();
                processBtn.disabled = false;
                processBtn.textContent = '⏺ Process & Export';
                setStatus('ready', '✓ File downloaded');
            };

            mediaRecorder.start(500);
            processBtn.textContent = '⏳ Processing…';
            setStatus('recording', '⏺ Recording — will download when video ends');

            // When video ends, stop recording → triggers onstop → downloads
            video.addEventListener('ended', function onEnded() {
                video.removeEventListener('ended', onEnded);
                if (mediaRecorder?.state === 'recording') mediaRecorder.stop();
                stopLoop();
                playPauseBtn.textContent = '▶ Play';
            });
        }

        processBtn.onclick = () => {
            recordedChunks = [];
            processBtn.disabled = true;
            video.pause();
            video.currentTime = 0;

            // 3-second countdown before recording starts
            let count = 3;
            countdownOverlay.innerHTML = `<span class="countdown-number">${count}</span>`;
            countdownOverlay.classList.add('visible');
            processBtn.textContent = `⏳ Starting in ${count}…`;
            setStatus('active', `▶ Starting in ${count}…`);

            const tick = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownOverlay.innerHTML = `<span class="countdown-number">${count}</span>`;
                    processBtn.textContent = `⏳ Starting in ${count}…`;
                    setStatus('active', `▶ Starting in ${count}…`);
                } else {
                    clearInterval(tick);
                    countdownOverlay.classList.remove('visible');
                    setTimeout(() => { countdownOverlay.innerHTML = ''; }, 300);
                    beginRecording();
                }
            }, 1000);
        };

        // ─────────────────────────────────────────────
        //  Boot
        // ─────────────────────────────────────────────
        setStatus('ready', '✓ Ready — upload a video');
        canvasWrap.classList.add('click-blur-mode');
    </script>
</body>

</html>
